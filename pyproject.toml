[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper",
    "piper-tts",
    "sounddevice",
    "numpy",
    "httpx",
    "keyring",
    "pyobjc-framework-EventKit",
    "claude-agent-sdk==0.2.151",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
